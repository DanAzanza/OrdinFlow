llm_backend: llama_cpp
server_url: http://127.0.0.1:8080/v1
server_api_key: not-needed
llm_model_path: models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
mmproj_path: models/mmproj-BF16.gguf
max_dimension: 2048
crop_padding: 5
white_border: 8
contrast_limit: 1
delay_seconds: 6
folder_match_threshold: 0.9
dashboard_port: 8080
crop_edge_threshold: 45
min_contour_area: 10
classify_dimension: 1280
vision_api_timeout: 120
vision_api_retries: 3
base_dir: .
watch_dir: C:\OrdinFlowTest\Inbox
target_base_dir: C:\OrdinFlowTest\Cases
vision_base_rules: ''
signature_base_rules: 'SIGNATURE / SIGNING RULES:

  - Search extremely tolerantly on the submitted pages for handwritten signatures,
  initials, pen-scribbles, hand marks, wavy lines, crosses, ticks, ballpoint pen scribbles,
  handwritten name signatures or outlines.

  - On documents and prescriptions, the signature is very often drawn directly on
  or across/around the printed name of the doctor or the practice stamp. Any such
  handwritten ink on the document must strictly be evaluated as present.

  - An empty signature field or exclusively printed text without handwritten ink is
  evaluated as false.'
folder_delimiter: __
folder_structure:
- '{Datum}'
- '{Produkt}'
- '{Nachname}'
- '{Vorname}'
- '{Titel}'
match_folder_by:
- Nachname
- Vorname
- Titel
save_empty_pages: false
