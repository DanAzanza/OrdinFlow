id: import_inbox_example
name: Inbox Folder Import (Example)
type: import
description: Example configuration for automatic file import and AI document classification.
enabled: true
allowed_extensions:
- .pdf
- .png
- .jpg
- .jpeg
- .tif
- .tiff
split_multi_documents: true
save_empty_pages: false
trigger: on_queue

document_types:
  Invoice:
    classification_desc: An official invoice document or credit note containing amounts, invoice number, and invoice date.
    emoji: 🧾
    extraction_fields:
      InvoiceDate: Issue date of the invoice in DD-MM-YYYY format (e.g. 07.04.26 becomes 07-04-2026).
      InvoiceNumber: The unique invoice number (e.g. INV-2026-1049).
      Recipient: The name of the invoice recipient or client (last name, first name, or company name).
      TotalAmount: The total invoice amount including currency (e.g. 149.50 EUR).
    routing:
      archive: true
      filename_template: Invoice__{Recipient}__{InvoiceDate}
    validation:
      optional_fields:
      - InvoiceNumber
      signature_required: false

  Contract:
    classification_desc: A legal contract, agreement, or service contract between two parties.
    emoji: 📜
    extraction_fields:
      ContractDate: Date of contract conclusion in DD-MM-YYYY format.
      ContractType: The type of contract (e.g. lease agreement, employment contract, sales contract, service).
      PartnerName: Name of the contracting partner or company.
    routing:
      archive: true
      filename_template: Contract__{ContractType}__{PartnerName}
    validation:
      signature_location: At the bottom of the last page above the signature field.
      signature_required: true

  Recipe:
    classification_desc: A cooking or baking recipe for cakes, pastries, or meals with ingredients list and preparation steps.
    emoji: 🍰
    extraction_fields:
      RecipeTitle: Name of the cake or pastry (e.g. Apple Pie, Marble Cake, Cheesecake).
      MainIngredient: Main ingredient or category (e.g. Apples, Chocolate, Curd).
      PreparationTime: The indicated baking time or preparation duration (e.g. 45 Min).
    routing:
      archive: true
      filename_template: Recipe__{RecipeTitle}
    validation:
      optional_fields:
      - PreparationTime
      signature_required: false

  PrivacyPolicy:
    classification_desc: A document or form providing information and consent regarding data privacy regulations (GDPR).
    emoji: 🔒
    dependent: true
    routing:
      archive: true
      filename_template: PrivacyPolicy
    validation:
      signature_location: Bottom right above the location, date, signature markings.
      signature_required: true

  Note:
    classification_desc: A handwritten or printed note, workshop memo, or brief message without a fixed form.
    emoji: 📝
    extraction_fields:
      Subject: Brief summary of the note topic in 1-3 words.
      Date: Date of the note if available (format DD-MM-YYYY or '----').
    routing:
      archive: true
      filename_template: Note__{Subject}
    validation:
      optional_fields:
      - Date
      signature_required: false

  Photo:
    classification_desc: An image or photo without structured document text.
    emoji: 📷
    dependent: true
    extraction_fields:
      Description: Short description of the depicted object or subject.
    routing:
      archive: true
      filename_template: Photo__{Description}
    validation:
      signature_required: false
