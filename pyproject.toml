[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ordinflow"
version = "0.9.0"
description = "Local AI-powered document management and RPA workflow engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "rapidocr-onnxruntime>=1.2.0",
    "regex>=2024.0.0",
    "pymupdf>=1.23.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.5.0",
    "pyright>=1.1.350",
]
server = [
    "instructor>=1.0.0",
    "openai>=1.0.0",
]

[tool.setuptools]
packages = [
    "core",
    "core.skills",
    "core.skills.engines",
    "routes",
    "routes.api",
]
py-modules = ["main", "dashboard"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "settings/**/*"]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B"]
ignore = ["E501", "E402", "S603", "S607"]  # E501: line length, E402: logger init imports, S603/S607: controlled subprocess invocations

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "S314"]
"scripts/*" = ["S101", "S108", "S110", "S310", "S311", "S602", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: slow integration tests relying on sample files and full document pipelines (deselected by default in fast local dev)",
]
addopts = "-m 'not integration'"

[tool.pyright]
include = ["core", "routes", "dashboard.py", "main.py"]
exclude = ["**/__pycache__", ".pytest_cache", "venv"]
pythonVersion = "3.12"
