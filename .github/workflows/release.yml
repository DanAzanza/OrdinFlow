name: OrdinFlow Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create as a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build, Verify & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Quality Gate Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest pytest-cov PyYAML
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pyright Static Analysis
        run: pyright core/ routes/

      - name: Run Automated Pytest Suite
        run: python -m pytest -v --tb=short

      - name: Determine Release Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver.StartsWith("v")) {
            $ver = "v" + $ver
          }
          Write-Output "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "[*] Target Release Version: $ver"

      - name: Build Release Bundle & SHA256 Checksums
        run: |
          python scripts/build_release.py --version ${{ env.RELEASE_VERSION }} --output-dir dist/

      - name: Adversarially Verify Built Release Bundle
        run: |
          python scripts/verify_release.py --archive dist/OrdinFlow-${{ env.RELEASE_VERSION }}.zip --checksum-file dist/OrdinFlow-${{ env.RELEASE_VERSION }}-checksums.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: OrdinFlow ${{ env.RELEASE_VERSION }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/OrdinFlow-${{ env.RELEASE_VERSION }}.zip
            dist/OrdinFlow-${{ env.RELEASE_VERSION }}-checksums.sha256
