name: 🐛 Bug Report
description: Create a report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in OrdinFlow! Please ensure you have tested on the latest `main` branch.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the unexpected behavior.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Place file into incoming directory...
        2. Run `python main.py`...
        3. See error in logs...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Hardware
      description: OS version, GPU / VRAM, Python version, and model used.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04
        - Python: 3.10.x
        - GPU: NVIDIA RTX 4070 (12GB) / CPU
        - Model: Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any error messages or stack traces from `main.log` or console.
      render: shell
    validations:
      required: false
